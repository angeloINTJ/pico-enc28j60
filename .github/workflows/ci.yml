name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The core that the library is tested with, and where to get the cores from
  ARDUINO_PICO_VERSION: 6.3.0
  ARDUINO_PICO_INDEX: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json

jobs:
  lint:
    name: arduino-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-lint
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-lint/main/etc/install.sh | sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Lint the library and its examples
        # Use `--library-manager update` once the library is in the Library
        # Manager. The absolute path matters: arduino-lint refuses a library
        # whose folder is named "."
        run: arduino-lint --library-manager false --compliance strict --project-type library "$GITHUB_WORKSPACE"

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check the formatting of the C and C++ sources
        # enc28j60-spi.pio.h is generated by pioasm and left as it is
        run: |
          clang-format-18 --dry-run --Werror \
            src/*.c src/*.cpp src/PicoENC28J60.h src/PicoENC28J60lwIP.h \
            src/enc28j60-cmd.h src/pico/*.h freertos/*.c freertos/pico/*.h

  docs:
    name: Markdown links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the links between the Markdown files
        run: python3 extras/tools/check-links.py

  pio:
    name: PIO header
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the core, which brings pioasm
        run: |
          arduino-cli core install rp2040:rp2040@${ARDUINO_PICO_VERSION} \
            --additional-urls "${ARDUINO_PICO_INDEX}"
      - name: enc28j60-spi.pio.h is what pioasm makes of enc28j60-spi.pio
        run: |
          pioasm=$(find ~/.arduino15/packages/rp2040/tools/pqt-pioasm -name pioasm -type f | head -n 1)
          "$pioasm" -o c-sdk src/enc28j60-spi.pio /tmp/enc28j60-spi.pio.h
          # The banner and the constexpr macro depend on the version of pioasm;
          # the program itself must be the same
          program() { grep -E '0x[0-9a-f]{4}|#define enc28j60_spi_(wrap|offset)|\.length|\.origin' "$1"; }
          diff <(program /tmp/enc28j60-spi.pio.h) <(program src/enc28j60-spi.pio.h)

  compile:
    name: ${{ matrix.board }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [rpipico, rpipicow, rpipico2, rpipico2w]
    steps:
      - uses: actions/checkout@v4
      - name: Examples and the bench sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: rp2040:rp2040:${{ matrix.board }}
          platforms: |
            - name: rp2040:rp2040
              source-url: ${{ env.ARDUINO_PICO_INDEX }}
              version: ${{ env.ARDUINO_PICO_VERSION }}
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples/BasicTest
            - examples/AdvancedTest
            - examples/WebServerLedToggle
            - extras/bench/BenchTest
            - extras/bench/BenchLwip
          cli-compile-flags: |
            - --warnings=all
          enable-warnings-report: true
      - name: The variants driven by the INT pin
        uses: arduino/compile-sketches@v1
        with:
          fqbn: rp2040:rp2040:${{ matrix.board }}
          platforms: |
            - name: rp2040:rp2040
              source-url: ${{ env.ARDUINO_PICO_INDEX }}
              version: ${{ env.ARDUINO_PICO_VERSION }}
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples/WebServerLedToggle
            - extras/bench/BenchTest
            - extras/bench/BenchLwip
          cli-compile-flags: |
            - --warnings=all
            - --build-property
            - compiler.cpp.extra_flags=-DINT_PIN=6 -DBENCH_IRQ_PIN=6

  oldest-core:
    # The oldest cores that the library says it works with: 4.0.0 for the raw
    # frames, 5.6.0 for the lwIP interface (which has to be compiled with it)
    name: core ${{ matrix.core }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: 4.0.0
            sketches: |
              - examples/BasicTest
              - examples/AdvancedTest
          - core: 5.6.0
            sketches: |
              - examples/BasicTest
              - examples/WebServerLedToggle
              - extras/bench/BenchLwip
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: rp2040:rp2040:rpipico
          platforms: |
            - name: rp2040:rp2040
              source-url: ${{ env.ARDUINO_PICO_INDEX }}
              version: ${{ matrix.core }}
          libraries: |
            - source-path: ./
          sketch-paths: ${{ matrix.sketches }}
          cli-compile-flags: |
            - --warnings=all

  latest-core:
    # An early warning when a new version of the core breaks the library; it
    # does not hold a change back
    name: latest core
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: rp2040:rp2040:rpipico
          platforms: |
            - name: rp2040:rp2040
              source-url: ${{ env.ARDUINO_PICO_INDEX }}
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples/BasicTest
            - examples/WebServerLedToggle
          cli-compile-flags: |
            - --warnings=all

  cmake:
    name: C driver with the Pico SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the tools
        run: sudo apt-get update && sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential
      - name: Get the Pico SDK
        run: git clone --depth 1 --branch 2.1.1 --recurse-submodules --shallow-submodules https://github.com/raspberrypi/pico-sdk "$RUNNER_TEMP/pico-sdk"
      - name: Build the driver as a CMake library
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          cat > "$RUNNER_TEMP/smoke/CMakeLists.txt" <<EOF
          cmake_minimum_required(VERSION 3.13)
          include(\$ENV{PICO_SDK_PATH}/external/pico_sdk_import.cmake)
          project(smoke C CXX ASM)
          pico_sdk_init()
          set(ENABLE_ENC28J60_FREERTOS_DRIVER FALSE)
          add_subdirectory($GITHUB_WORKSPACE/src enc28j60)
          add_executable(smoke main.c)
          target_compile_options(smoke PRIVATE -Wall -Wextra -Werror)
          # the static analyzer of GCC on the driver only: the SDK has findings of its own
          set_source_files_properties(
            $GITHUB_WORKSPACE/src/enc28j60-driver.c
            $GITHUB_WORKSPACE/src/enc28j60-cmd.c
            PROPERTIES COMPILE_OPTIONS "-fanalyzer")
          target_link_libraries(smoke pico_stdlib pico_enc28j60_driver)
          EOF
          cat > "$RUNNER_TEMP/smoke/main.c" <<EOF
          #include "pico/stdlib.h"
          #include "pico/enc28j60-driver.h"
          int main(void)
          {
              stdio_init_all();
              enc28j60_status status;
              enc28j60 *eth = enc28j60_init_status(enc28j60_get_default_config(), &status);
              return eth ? enc28j60_revision_blk(eth) : (int)status;
          }
          EOF
          export PICO_SDK_PATH="$RUNNER_TEMP/pico-sdk"
          cmake -S "$RUNNER_TEMP/smoke" -B "$RUNNER_TEMP/smoke/build"
          cmake --build "$RUNNER_TEMP/smoke/build" -j"$(nproc)"
